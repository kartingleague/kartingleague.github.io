<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karting League</title>
<meta name="description" content="Clasificaciones, rondas y carnet por puntos de la Karting League · Temporada 4">
<meta name="theme-color" content="#0A0E1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karting League">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* ============================================================ TOKENS
   Oscuro por defecto: es la identidad de la casa (retransmisión nocturna).
   El claro existe para quien lo pida desde el botón del sol. */
:root{
  color-scheme: dark;
  --bg:#0A0E1C; --bg2:#0E1324;
  --sup:#131A2E; --sup2:#1A2239; --sup3:#222B46;
  --linea:#252E4A; --linea2:#333D5E;
  --txt:#EEF1F8; --tenue:#8D95AE; --apagado:#5E6682;
  --marca:#E8284C; --noche:#1C2A4F;
  --oro:#FFC93C; --plata:#C8D0DD; --bronce:#DB8B4E;
  --vr:#B45CFF; --pole:#FFC93C; --verde:#2FD387;
  --adv:#F5A623; --leve:#FFD84D; --mod:#FF3B30; --grave:#B3261E;
  --sombra:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(0,0,0,.7);
  --cristal:rgba(10,14,28,.78);
  --kerb-a:#E8284C; --kerb-b:#F4F5F8;
  --k1:#E10600; --k1-hi:#FF4B3E; --k2:#2B63CF; --k2-hi:#6FA3FF;
  --acc:var(--k1); --acc-hi:var(--k1-hi);
  --r:18px; --r-s:12px;
  --f-disp:'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-txt:'Barlow', 'Segoe UI', system-ui, sans-serif;
  --nav-h:66px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#EEF0F5; --bg2:#E6E9F1;
  --sup:#FFFFFF; --sup2:#F4F6FA; --sup3:#E9ECF3;
  --linea:#DCE0EA; --linea2:#C9CFDD;
  --txt:#0E1428; --tenue:#56607C; --apagado:#8A92AA;
  --oro:#E0A800; --plata:#8D97A8; --bronce:#C06A2B;
  --vr:#8B2BE2; --pole:#C99400; --verde:#12A565;
  --adv:#D98300; --leve:#C9A200; --mod:#D91E14; --grave:#8E1A14;
  --sombra:0 1px 2px rgba(14,20,40,.06), 0 10px 24px -14px rgba(14,20,40,.25);
  --cristal:rgba(255,255,255,.82);
  --k1:#D10500; --k1-hi:#D10500; --k2:#1B4F9E; --k2-hi:#1B4F9E;
}
body[data-cat="k2"]{ --acc:var(--k2); --acc-hi:var(--k2-hi); }

/* ============================================================ BASE */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:var(--f-txt); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  min-height:100vh; overflow-x:hidden;
}
body::before{ /* resplandor del color de la categoría */
  content:""; position:fixed; inset:-20vh -20vw auto; height:70vh; z-index:-1; pointer-events:none;
  background:radial-gradient(60% 55% at 50% 0%, color-mix(in srgb, var(--acc) 26%, transparent), transparent 70%);
  transition:background .5s;
}
img{max-width:100%; display:block}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc-hi); outline-offset:2px; border-radius:6px}
[hidden]{display:none!important}
.num{font-family:var(--f-disp); font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* ============================================================ BARRA SUPERIOR */
.top{
  position:sticky; top:0; z-index:30;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;
  background:var(--cristal); backdrop-filter:saturate(1.4) blur(16px); -webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-bottom:1px solid var(--linea);
}
.top-in{max-width:1040px; margin:0 auto; display:flex; align-items:center; gap:12px; min-height:44px}
.marca{display:flex; align-items:center; gap:10px; text-decoration:none; min-width:0}
.marca img{width:46px; height:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.marca b{display:block; font-family:var(--f-disp); font-weight:700; font-size:17px; letter-spacing:.09em; line-height:1; white-space:nowrap}
.marca small{display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--tenue); margin-top:3px; white-space:nowrap}
.marca > span{min-width:0}
@media (max-width:400px){
  .top-in{gap:8px}
  .marca{gap:8px}
  .marca img{width:38px}
  .marca b{font-size:14px; letter-spacing:.04em}
  .marca small{font-size:10px; letter-spacing:.1em}
  .seg button{padding:7px 11px}
  .icono-btn{width:34px; height:34px}
}
.top-der{margin-left:auto; display:flex; align-items:center; gap:8px}
.seg{display:inline-flex; padding:3px; border-radius:999px; background:var(--sup2); border:1px solid var(--linea); position:relative}
.seg button{position:relative; z-index:1; padding:7px 14px; border-radius:999px; font-family:var(--f-disp); font-weight:600; font-size:14px; letter-spacing:.06em; color:var(--tenue); transition:color .2s}
.seg button[aria-pressed="true"]{color:#fff}
.seg .pastilla{position:absolute; top:3px; bottom:3px; left:3px; border-radius:999px; background:var(--acc); box-shadow:0 4px 14px -4px var(--acc); transition:transform .3s cubic-bezier(.3,1.3,.5,1), width .3s, background .4s}
.icono-btn{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--tenue); border:1px solid var(--linea); background:var(--sup2)}
.icono-btn:hover{color:var(--txt)}
.ico{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* ============================================================ CONTENEDOR Y VISTAS */
main{max-width:1040px; margin:0 auto; padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.vista{display:grid; gap:22px; animation:entra .45s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0; transform:translateY(8px)}}
.rotulo{display:flex; align-items:center; gap:10px; margin:6px 0 -8px; font-family:var(--f-disp); font-weight:600; font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--tenue)}
.rotulo::before{content:""; width:14px; height:12px; background:var(--acc); transform:skewX(-20deg); border-radius:2px}
.rotulo .der{margin-left:auto; letter-spacing:.08em; font-size:12px; color:var(--apagado)}
.tarjeta{background:var(--sup); border:1px solid var(--linea); border-radius:var(--r); box-shadow:var(--sombra)}
.dos{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.vacio{padding:26px; text-align:center; color:var(--tenue)}

/* chips y pestañas */
.chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px; margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--linea); background:var(--sup); font-weight:600; font-size:13.5px; color:var(--tenue); white-space:nowrap; transition:.2s}
.chip[aria-pressed="true"]{background:var(--txt); color:var(--bg); border-color:var(--txt)}
.pestanas{display:flex; gap:4px; padding:4px; background:var(--sup2); border:1px solid var(--linea); border-radius:14px}
.pestanas button{flex:1; padding:9px 8px; border-radius:10px; font-family:var(--f-disp); font-weight:500; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--tenue)}
.pestanas button[aria-pressed="true"]{background:var(--sup); color:var(--txt); box-shadow:0 2px 8px -2px rgba(0,0,0,.35)}
.interruptor{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--tenue); font-weight:600}
.interruptor .sw{width:40px; height:24px; border-radius:99px; background:var(--sup3); border:1px solid var(--linea2); position:relative; transition:.25s}
.interruptor .sw::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--tenue); transition:.25s}
.interruptor[aria-pressed="true"] .sw{background:var(--acc); border-color:var(--acc)}
.interruptor[aria-pressed="true"] .sw::after{transform:translateX(16px); background:#fff}
.interruptor[aria-pressed="true"]{color:var(--txt)}

/* ============================================================ AVATARES / LOGOS */
.av{--c:var(--acc); width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; position:relative;
  font-family:var(--f-disp); font-weight:600; font-size:15px; letter-spacing:.02em; color:#fff;
  background:radial-gradient(120% 120% at 30% 20%, color-mix(in srgb, var(--c) 85%, #fff 15%), color-mix(in srgb, var(--c) 55%, #000 45%));
  box-shadow:0 0 0 2px var(--sup), 0 0 0 3.5px color-mix(in srgb, var(--c) 70%, transparent)}
.av.g{width:78px; height:78px; font-size:28px}
.av.m{width:54px; height:54px; font-size:19px}
.logo-eq{width:34px; height:34px; border-radius:50%; background:#fff; flex:none; display:grid; place-items:center; overflow:hidden; box-shadow:0 0 0 1px var(--linea)}
.logo-eq img{width:100%; height:100%; object-fit:contain}
.logo-eq.g{width:72px; height:72px}
.logo-eq.p{width:22px; height:22px}
.wk{display:inline-block; font-family:var(--f-disp); font-size:10.5px; font-weight:600; letter-spacing:.1em; padding:1px 6px; border-radius:5px; background:var(--sup3); color:var(--tenue); vertical-align:2px; margin-left:6px}

/* ============================================================ INICIO */
.hero{position:relative; overflow:hidden; border-radius:24px; padding:22px 20px 26px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--noche) 85%, var(--bg)) 0%, var(--bg2) 70%);
  border:1px solid var(--linea); box-shadow:var(--sombra); color:#fff}
:root[data-theme="light"] .hero{background:linear-gradient(135deg,#1C2A4F 0%,#0E1530 80%); border-color:transparent}
.hero::before{content:""; position:absolute; inset:0; opacity:.07; pointer-events:none;
  background-image:conic-gradient(#fff 25%, transparent 0 50%, #fff 0 75%, transparent 0); background-size:22px 22px;
  -webkit-mask-image:linear-gradient(100deg, transparent 45%, #000 100%); mask-image:linear-gradient(100deg, transparent 45%, #000 100%)}
.hero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:7px;
  background:repeating-linear-gradient(90deg, var(--kerb-a) 0 22px, var(--kerb-b) 22px 44px)}
.hero-cab{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; position:relative; z-index:1}
.eyebrow{font-family:var(--f-disp); font-size:12.5px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:#FF6B84}
.hero h1{font-family:var(--f-disp); font-weight:700; font-size:clamp(34px,8.6vw,58px); line-height:.95; margin:8px 0 6px; letter-spacing:.01em; text-transform:uppercase; text-wrap:balance}
.hero .lugar{color:#B7BFD6; font-size:15px; font-weight:500}
.cuenta{text-align:right; flex:none}
.cuenta b{display:block; font-family:var(--f-disp); font-weight:600; font-size:clamp(46px,11vw,72px); line-height:.9; font-variant-numeric:tabular-nums}
.cuenta span{font-family:var(--f-disp); font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:#B7BFD6}
.hero-pista{position:relative; z-index:1; margin:12px auto 4px; height:170px; display:grid; place-items:center}
.hero-pista svg{height:170px; width:100%; overflow:visible}
.hero-datos{position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:13px; color:#B7BFD6}
.hero-datos b{font-family:var(--f-disp); font-weight:500; color:#fff; font-size:15px; letter-spacing:.04em; margin-right:4px}

/* trazado */
.trk-base{fill:none; stroke:rgba(255,255,255,.12); stroke-width:10; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke}
.trk-line{fill:none; stroke:var(--acc-hi); stroke-width:3; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke;
  stroke-dasharray:1000; stroke-dashoffset:0; filter:drop-shadow(0 0 6px var(--acc))}
.dibuja .trk-line{animation:dibuja 2.2s cubic-bezier(.6,0,.2,1) both}
@keyframes dibuja{from{stroke-dashoffset:1000}}
.trk-coche{fill:#fff; filter:drop-shadow(0 0 5px #fff)}
.trk-flecha{fill:none; stroke:#fff; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; opacity:.9}
.dibuja .trk-flecha, .dibuja .trk-meta{animation:aparece .5s 1.9s both}
@keyframes aparece{from{opacity:0}}
.mini-trk .trk-base{stroke:var(--sup3); stroke-width:6}
.mini-trk .trk-line{stroke-width:2; filter:none; stroke:var(--tenue)}

/* progreso de la temporada */
.temporada{padding:16px 18px}
.temporada .cab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px}
.temporada .cab b{font-family:var(--f-disp); font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase}
.temporada .cab span{font-size:13px; color:var(--tenue)}
.tramos{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.tramo{display:grid; gap:6px; text-align:center; text-decoration:none}
.tramo i{height:8px; border-radius:3px; background:var(--sup3); transform:skewX(-18deg)}
.tramo.hecho i{background:var(--acc)}
.tramo.prox i{background:repeating-linear-gradient(90deg, var(--acc) 0 4px, transparent 4px 8px); opacity:.8}
.tramo small{font-family:var(--f-disp); font-size:12px; letter-spacing:.06em; color:var(--tenue)}
.tramo.hecho small{color:var(--txt)}

/* líderes */
.lider{position:relative; overflow:hidden; padding:18px; display:grid; gap:14px; text-align:left; width:100%}
.lider .cat{display:flex; align-items:center; justify-content:space-between}
.tagcat{font-family:var(--f-disp); font-weight:700; font-size:13px; letter-spacing:.1em; padding:3px 9px; border-radius:6px; color:#fff; background:var(--c)}
.lider .fl{display:flex; align-items:center; gap:14px}
.lider .nombre{font-family:var(--f-disp); font-weight:600; font-size:24px; line-height:1.05; letter-spacing:.02em}
.lider .eq{font-size:13px; color:var(--tenue)}
.lider .pts{margin-left:auto; text-align:right}
.lider .pts b{font-family:var(--f-disp); font-size:38px; font-weight:600; line-height:1}
.lider .pts small{display:block; font-size:11px; letter-spacing:.14em; color:var(--tenue); text-transform:uppercase}
.lider .pie{display:flex; gap:10px; font-size:13px; color:var(--tenue); border-top:1px dashed var(--linea); padding-top:12px}
.lider .pie b{color:var(--txt); font-weight:600}
.lider::after{content:attr(data-num); position:absolute; right:-6px; top:-26px; font-family:var(--f-disp); font-weight:700; font-size:130px; line-height:1; color:var(--c); opacity:.08; pointer-events:none}

/* lo último */
.feed{padding:4px 0}
.feed a{display:flex; align-items:center; gap:12px; padding:12px 16px; text-decoration:none; border-top:1px solid var(--linea)}
.feed a:first-child{border-top:0}
.feed .marca-ic{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:none; background:var(--sup2); font-family:var(--f-disp); font-weight:700; font-size:13px}
.feed p{margin:0; font-size:14.5px; line-height:1.3}
.feed p small{display:block; color:var(--tenue); font-size:12.5px}
.feed .val{margin-left:auto; font-family:var(--f-disp); font-size:15px; font-weight:500; white-space:nowrap}

/* palmarés */
.palmares{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(230px,1fr); gap:12px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px}
.palmares::-webkit-scrollbar{display:none}
.temp{padding:16px; display:grid; gap:10px; align-content:start}
.temp .t{display:flex; justify-content:space-between; align-items:baseline}
.temp .t b{font-family:var(--f-disp); font-size:30px; font-weight:700; line-height:1; color:var(--oro)}
.temp .t span{font-size:12.5px; color:var(--tenue)}
.campeon{display:flex; gap:10px; align-items:center; font-size:14px}
.campeon .copa{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:color-mix(in srgb, var(--oro) 16%, transparent); color:var(--oro)}
.campeon b{font-family:var(--f-disp); font-weight:600; font-size:16px; letter-spacing:.02em}
.campeon small{display:block; color:var(--tenue); font-size:12px}

/* patrocinadores */
.patros{padding:18px; display:grid; gap:14px; background:#F4F5F8; border-color:transparent; color:#0E1428}
.patros .main{display:flex; align-items:center; justify-content:center; gap:14px; padding-bottom:14px; border-bottom:1px solid #DCE0EA}
.patros .main small, .patros > small{font-family:var(--f-disp); letter-spacing:.2em; font-size:11px; color:#56607C; text-transform:uppercase; text-align:center}
.patros .main img{max-height:54px; max-width:170px; width:auto}
.patros .lista{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; align-items:center; justify-items:center}
.patros .lista img{max-height:44px; max-width:120px; width:auto}

/* ============================================================ CLASIFICACIÓN */
.controles{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.controles .pestanas{flex:1 1 320px}
.podio{display:grid; grid-template-columns:1fr 1.18fr 1fr; gap:10px; align-items:end}
.caj{position:relative; text-align:center; padding:14px 8px 12px; border-radius:var(--r) var(--r) 10px 10px; background:var(--sup); border:1px solid var(--linea); display:grid; justify-items:center; gap:6px; overflow:hidden}
.caj::before{content:""; position:absolute; inset:0 0 auto; height:4px; background:var(--m)}
.caj.p1{padding-top:18px; padding-bottom:18px; background:linear-gradient(180deg, color-mix(in srgb, var(--acc) 16%, var(--sup)) 0%, var(--sup) 70%)}
.caj .puesto{font-family:var(--f-disp); font-weight:700; font-size:13px; letter-spacing:.14em; color:var(--m)}
.caj .nombre{font-family:var(--f-disp); font-weight:600; font-size:clamp(13px,3.9vw,16px); line-height:1.1; letter-spacing:.01em; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.caj.p1 .nombre{font-size:clamp(15px,4.6vw,19px)}
.caj .eq{font-size:11.5px; color:var(--tenue); line-height:1.2; max-width:100%}
.caj .pts{font-family:var(--f-disp); font-size:26px; font-weight:600; line-height:1}
.caj.p1 .pts{font-size:34px}
.caj .pts small{font-size:11px; color:var(--tenue); letter-spacing:.12em; margin-left:3px}
.caj .gap{font-size:12px; color:var(--tenue); font-family:var(--f-disp); letter-spacing:.04em}
.tabla{overflow:hidden}
.fila{display:grid; grid-template-columns:34px 18px 1fr auto auto; align-items:center; gap:10px; padding:10px 14px; width:100%; text-align:left; border-top:1px solid var(--linea); position:relative; transition:background .15s}
.fila:first-child{border-top:0}
.fila:hover{background:var(--sup2)}
.fila::before{content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--c, transparent)}
.fila.mia{background:color-mix(in srgb, var(--acc) 12%, var(--sup))}
.fila.mia::after{content:"TÚ"; position:absolute; right:6px; top:4px; font-family:var(--f-disp); font-size:9px; letter-spacing:.14em; color:var(--acc-hi)}
.pos{font-family:var(--f-disp); font-weight:600; font-size:20px; text-align:center; font-variant-numeric:tabular-nums}
.pos.p1{color:var(--oro)} .pos.p2{color:var(--plata)} .pos.p3{color:var(--bronce)}
.delta{font-family:var(--f-disp); font-size:11px; font-weight:600; text-align:center; line-height:1}
.delta.sube{color:var(--verde)} .delta.baja{color:var(--mod)} .delta.igual{color:var(--apagado)}
.quien{display:flex; align-items:center; gap:11px; min-width:0}
.quien .txt{min-width:0}
.quien b{display:block; font-family:var(--f-disp); font-weight:500; font-size:17px; letter-spacing:.02em; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.quien small{display:block; font-size:12.5px; color:var(--tenue); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.forma{display:flex; gap:3px}
.forma i{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-style:normal; font-family:var(--f-disp); font-size:11.5px; font-weight:600; background:var(--sup3); color:var(--tenue)}
.forma i.p1{background:var(--oro); color:#1b1400} .forma i.p2{background:var(--plata); color:#15181f} .forma i.p3{background:var(--bronce); color:#1d0f04}
.forma i.x{opacity:.35; text-decoration:line-through}
.forma i.dns{font-size:8.5px; letter-spacing:0}
.pts-col{text-align:right; min-width:58px}

@media (max-width:520px){
  .tabla .fila{grid-template-columns:26px 16px 1fr auto auto; gap:8px; padding:10px 12px}

}
.leyenda{font-size:12.5px; color:var(--tenue); display:flex; flex-wrap:wrap; gap:6px 14px; padding:0 4px}
.leyenda span{display:inline-flex; align-items:center; gap:6px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:14px; font-weight:700; font-size:14.5px; background:var(--acc); color:#fff; box-shadow:0 8px 20px -10px var(--acc)}
.btn.sec{background:var(--sup2); color:var(--txt); border:1px solid var(--linea); box-shadow:none}
.mi-tarjeta{display:flex; align-items:center; gap:14px; padding:14px 16px; text-align:left; width:100%}
.mi-tarjeta .txt{flex:1; min-width:0}
.mi-tarjeta small{display:block; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--acc-hi); font-family:var(--f-disp)}
.mi-tarjeta b{font-family:var(--f-disp); font-size:19px; font-weight:600}
.mi-tarjeta p{margin:2px 0 0; font-size:13.5px; color:var(--tenue)}
.mi-tarjeta .gp{font-family:var(--f-disp); font-size:30px; font-weight:600}

/* tabla carrera a carrera */
.matriz-wrap{overflow-x:auto; border-radius:var(--r)}
.matriz{border-collapse:separate; border-spacing:0; width:100%; font-size:13px; min-width:640px}
.matriz th{font-family:var(--f-disp); font-weight:500; letter-spacing:.08em; font-size:11.5px; color:var(--tenue); padding:10px 4px 6px; text-align:center; background:var(--sup); position:sticky; top:0}
.matriz th.r{border-left:1px solid var(--linea)}
.matriz td{padding:6px 3px; text-align:center; border-top:1px solid var(--linea)}
.matriz td.n{text-align:left; padding-left:12px; position:sticky; left:0; background:var(--sup); z-index:1; white-space:nowrap; font-family:var(--f-disp); font-size:14px; font-weight:500}
.matriz td.n i{display:inline-block; width:3px; height:14px; border-radius:2px; background:var(--c); margin-right:8px; vertical-align:-2px}
.matriz th.n{position:sticky; left:0; z-index:2; text-align:left; padding-left:12px}
.matriz td.r{border-left:1px solid var(--linea)}
.matriz .c{display:inline-grid; place-items:center; width:26px; height:24px; border-radius:6px; font-family:var(--f-disp); font-weight:600; position:relative}
.matriz .c.p1{background:var(--oro); color:#1b1400} .matriz .c.p2{background:var(--plata); color:#15181f} .matriz .c.p3{background:var(--bronce); color:#1d0f04}
.matriz .c.x{opacity:.35; text-decoration:line-through}
.matriz .c.dns{font-size:9px; color:var(--mod)}
.matriz .c .mk{position:absolute; top:-3px; right:-3px; width:7px; height:7px; border-radius:50%; border:1.5px solid var(--sup)}
.matriz .c .mk.pole{background:var(--pole)} .matriz .c .mk.vr{background:var(--vr); right:auto; left:-3px} .matriz .c .mk.pen{background:var(--mod); top:auto; bottom:-3px}
.matriz td.t{font-family:var(--f-disp); font-weight:600; font-size:16px; padding-right:12px; border-left:1px solid var(--linea)}
.punto{display:inline-block; width:8px; height:8px; border-radius:50%}

/* ============================================================ RONDAS */
.calendario{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(148px,1fr); gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 6px; margin:0 -2px; scroll-snap-type:x proximity}
.calendario::-webkit-scrollbar{display:none}
.rd{scroll-snap-align:start; text-align:left; padding:12px; border-radius:16px; background:var(--sup); border:1px solid var(--linea); display:grid; gap:8px; transition:.2s; position:relative}
.rd[aria-pressed="true"]{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc), 0 12px 24px -16px var(--acc)}
.rd .rn{display:flex; justify-content:space-between; align-items:center; font-family:var(--f-disp); font-weight:600; font-size:13px; letter-spacing:.1em}
.rd .rn em{font-style:normal; font-size:10.5px; letter-spacing:.12em; padding:2px 7px; border-radius:99px; background:var(--sup3); color:var(--tenue)}
.rd .rn em.ok{background:color-mix(in srgb, var(--verde) 18%, transparent); color:var(--verde)}
.rd .rn em.prox{background:color-mix(in srgb, var(--acc) 22%, transparent); color:var(--acc-hi)}
.rd .mini-trk{height:52px; display:grid; place-items:center}
.rd .mini-trk svg{height:52px; width:100%}
.rd[aria-pressed="true"] .mini-trk .trk-line{stroke:var(--acc-hi)}
.rd b{font-family:var(--f-disp); font-weight:500; font-size:15px; line-height:1.1}
.rd small{font-size:12px; color:var(--tenue)}
.ronda-cab{position:relative; overflow:hidden; padding:18px; display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center}
.ronda-cab h2{margin:4px 0 2px; font-family:var(--f-disp); font-weight:700; font-size:30px; line-height:1; text-transform:uppercase}
.ronda-cab .eyebrow{color:var(--acc-hi)}
.ronda-cab p{margin:0; color:var(--tenue); font-size:14px}
.ronda-cab .trk-g{width:130px; height:96px; display:grid; place-items:center}
.ronda-cab .trk-g svg{height:96px; width:130px}
.ronda-cab .datos{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px}
.dato{padding:6px 10px; border-radius:10px; background:var(--sup2); font-size:12.5px; color:var(--tenue)}
.dato b{color:var(--txt); font-family:var(--f-disp); font-weight:500; font-size:14px; margin-right:3px}
.ronda-cab .logo-circ{position:absolute; right:14px; top:14px; height:26px; width:auto; opacity:.9; background:#fff; padding:3px 6px; border-radius:6px}
.destacados{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(236px,1fr); gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px; margin:0 -2px}
.destacados::-webkit-scrollbar{display:none}
.dest{padding:12px 14px; display:flex; align-items:center; gap:12px; border-radius:16px; background:var(--sup); border:1px solid var(--linea); text-align:left; width:100%}
.dest .ic{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex:none; color:#fff; background:var(--c)}
.dest small{display:block; font-family:var(--f-disp); font-size:11px; letter-spacing:.16em; color:var(--tenue); text-transform:uppercase}
.dest b{font-family:var(--f-disp); font-weight:500; font-size:16px}
.dest .val{margin-left:auto; font-family:var(--f-disp); font-size:16px; font-weight:500; text-align:right}
.dest .val small{letter-spacing:.06em}
.res .fila{grid-template-columns:34px 1fr auto auto}
.badge{display:inline-flex; align-items:center; gap:4px; font-family:var(--f-disp); font-size:11px; font-weight:600; letter-spacing:.06em; padding:2px 7px; border-radius:6px; white-space:nowrap}
.badge.vr{background:color-mix(in srgb, var(--vr) 20%, transparent); color:var(--vr)}
.badge.pole{background:color-mix(in srgb, var(--pole) 20%, transparent); color:var(--pole)}
.badge.pen{background:color-mix(in srgb, var(--mod) 18%, transparent); color:var(--mod)}
.badge.dns{background:var(--sup3); color:var(--tenue)}
.badges{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end}
.tiempo{font-family:var(--f-disp); font-size:16px; font-variant-numeric:tabular-nums; text-align:right}
.tiempo small{display:block; font-size:12px; color:var(--tenue)}
.tiempo.mejor{color:var(--vr)}
.pendiente{padding:22px; display:grid; gap:10px; justify-items:center; text-align:center}
.pendiente b{font-family:var(--f-disp); font-size:56px; font-weight:600; line-height:1}
.pendiente span{color:var(--tenue)}

/* ============================================================ CARNET */
.resumen{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
@media (max-width:560px){.resumen{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px; border-radius:16px; background:var(--sup); border:1px solid var(--linea); position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c)}
.kpi b{display:block; font-family:var(--f-disp); font-size:32px; font-weight:600; line-height:1}
.kpi span{font-size:12.5px; color:var(--tenue)}
.carnets{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
@media (max-width:520px){
  .carnets{grid-template-columns:1fr 1fr; gap:8px}
  .carnets .carnet{padding:12px; gap:8px}
  .carnets .carnet .av{display:none}
  .carnets .carnet .cab{align-items:flex-start}
  .carnets .carnet .cab b{font-size:15px}
  .carnets .carnet .saldo{font-size:24px}
  .carnets .puntos10{gap:3px} .carnets .puntos10 i{height:6px}
}
.carnet{padding:14px; display:grid; gap:10px; text-align:left; width:100%}
.carnet .cab{display:flex; align-items:center; gap:10px}
.carnet .cab .txt{flex:1; min-width:0}
.carnet .cab b{display:block; font-family:var(--f-disp); font-weight:500; font-size:16px; line-height:1.1}
.carnet .cab small{font-size:12px; color:var(--tenue)}
.carnet .saldo{font-family:var(--f-disp); font-weight:600; font-size:28px; line-height:1}
.carnet .saldo small{font-size:13px; color:var(--tenue); font-weight:400}
.carnet .saldo.aviso{color:var(--leve)} .carnet .saldo.peligro{color:var(--mod)}
.puntos10{display:grid; grid-template-columns:repeat(10,1fr); gap:4px}
.puntos10 i{height:8px; border-radius:3px; background:var(--verde)}
.puntos10 i.fuera{background:color-mix(in srgb, var(--mod) 30%, var(--sup3))}
.advs{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--adv)}
.advs i{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--adv)}
.advs i.on{background:var(--adv)}
.sanciones{display:grid; gap:10px}
.sancion{padding:14px 16px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px}
.sancion .id{grid-row:span 3; font-family:var(--f-disp); font-weight:300; font-size:30px; line-height:1; color:var(--apagado); font-variant-numeric:tabular-nums; min-width:40px}
.sancion .cab{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sancion .cab b{font-family:var(--f-disp); font-weight:500; font-size:17px}
.sancion .meta{font-size:12.5px; color:var(--tenue)}
.sancion p{margin:4px 0 0; font-size:14.5px; line-height:1.45}
.tipo{font-family:var(--f-disp); font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:6px; margin-left:auto}
.tipo.Advertencia{background:color-mix(in srgb, var(--adv) 20%, transparent); color:var(--adv)}
.tipo.Leve{background:var(--leve); color:#2a2200}
.tipo.Moderada{background:var(--mod); color:#fff}
.tipo.Grave{background:linear-gradient(135deg,#991b1b,#6d1212); color:#fff}
.pen-txt{font-family:var(--f-disp); font-size:13px; letter-spacing:.04em; color:var(--txt)}

/* ============================================================ MI PILOTO */
.buscador{display:flex; align-items:center; gap:10px; padding:0 14px; border-radius:14px; background:var(--sup); border:1px solid var(--linea)}
.buscador input{flex:1; min-width:0; padding:14px 0; border:0; background:transparent; color:var(--txt); font:inherit; font-size:16px; outline:none}
.buscador .ico{color:var(--tenue)}
.elige{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px}
.elige button{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--sup); border:1px solid var(--linea); text-align:left}
.elige button:hover{border-color:var(--linea2)}
.elige b{display:block; font-family:var(--f-disp); font-weight:500; font-size:15.5px; line-height:1.1}
.elige small{font-size:12px; color:var(--tenue)}

/* ============================================================ FICHA (hoja inferior) */
.velo{position:fixed; inset:0; z-index:50; background:rgba(3,5,12,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s}
.velo.abierta{opacity:1; pointer-events:auto}
.hoja{position:fixed; z-index:51; left:0; right:0; bottom:0; margin:0 auto; max-width:760px; max-height:calc(100% - env(safe-area-inset-top,0px) - 24px); overflow-y:auto; overscroll-behavior:contain;
  background:var(--bg); border-radius:24px 24px 0 0; border:1px solid var(--linea); border-bottom:0; box-shadow:0 -20px 60px -20px rgba(0,0,0,.7);
  transform:translateY(105%); transition:transform .38s cubic-bezier(.2,.9,.25,1); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.hoja.abierta{transform:none}
.hoja .asa{position:sticky; top:0; z-index:3; display:flex; justify-content:center; padding:8px 0 0; height:0}
.hoja .asa i{width:44px; height:5px; border-radius:9px; background:rgba(255,255,255,.35)}
.hoja .cerrar{position:absolute; top:14px; right:14px; z-index:4; background:rgba(0,0,0,.35); color:#fff; border-color:rgba(255,255,255,.2)}
.ficha{display:grid; gap:18px}
.ficha-cab{position:relative; overflow:hidden; padding:34px 20px 20px; color:#fff;
  background:linear-gradient(160deg, color-mix(in srgb, var(--c) 70%, #0A0E1C) 0%, #0E1324 75%)}
.ficha-cab::before{content:attr(data-num); position:absolute; right:-10px; bottom:-40px; font-family:var(--f-disp); font-weight:700; font-size:220px; line-height:1; color:#fff; opacity:.08; letter-spacing:-.04em}
.ficha-cab::after{content:""; position:absolute; inset:0; opacity:.06; background-image:conic-gradient(#fff 25%, transparent 0 50%, #fff 0 75%, transparent 0); background-size:18px 18px; -webkit-mask-image:linear-gradient(90deg,transparent 40%,#000); mask-image:linear-gradient(90deg,transparent 40%,#000)}
.ficha-cab .fila-cab{position:relative; z-index:1; display:flex; align-items:center; gap:16px}
.ficha-cab h2{margin:0; font-family:var(--f-disp); font-weight:700; font-size:clamp(30px,8vw,42px); line-height:1; letter-spacing:.01em; text-transform:uppercase; overflow-wrap:anywhere}
.ficha-cab .sub{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:14px; color:rgba(255,255,255,.8)}
.ficha-cab .av{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.ficha-cab .logo-eq{box-shadow:none}
.ficha-in{padding:0 16px; display:grid; gap:18px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
@media (min-width:560px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{padding:12px 10px; border-radius:14px; background:var(--sup); border:1px solid var(--linea); text-align:center}
.stat b{display:block; font-family:var(--f-disp); font-size:26px; font-weight:600; line-height:1}
.stat span{font-size:11.5px; color:var(--tenue); letter-spacing:.04em}
.stat.acc b{color:var(--acc-hi)}
.frase{padding:14px 16px; font-size:15px; line-height:1.4}
.frase b{font-family:var(--f-disp); font-weight:600; font-size:17px}
.grafica{padding:14px 10px 8px}
.grafica svg{width:100%; height:auto; display:block}
.gr-eje{stroke:var(--linea); stroke-width:1}
.gr-txt{fill:var(--tenue); font-family:var(--f-disp); font-size:11px}
.gr-linea{fill:none; stroke:var(--acc-hi); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.gr-area{fill:url(#grArea)}
.gr-punto{fill:var(--bg); stroke:var(--acc-hi); stroke-width:2.5}
.gr-val{fill:var(--txt); font-family:var(--f-disp); font-size:13px; font-weight:600}
.gr-barra{fill:var(--acc)}
.gr-barra.x{fill:var(--sup3)}
.mangas{display:grid; gap:8px}
.manga-r{display:grid; grid-template-columns:86px 1fr 1fr; gap:8px; align-items:stretch}
.manga-r .r{font-family:var(--f-disp); font-size:13px; letter-spacing:.06em; line-height:1.15; padding:8px 0}
.manga-r .r small{display:block; color:var(--tenue); font-size:11.5px; letter-spacing:.02em}
.manga{border-radius:12px; background:var(--sup); border:1px solid var(--linea); padding:8px 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.manga .p{font-family:var(--f-disp); font-weight:600; font-size:20px; min-width:36px}
.manga .p.p1{color:var(--oro)} .manga .p.p2{color:var(--plata)} .manga .p.p3{color:var(--bronce)}
.manga .pp{font-family:var(--f-disp); font-size:13px; color:var(--tenue); margin-left:auto}
.manga.x{opacity:.55; border-style:dashed}
.manga.nd{color:var(--apagado); font-size:13px}
.duelo{padding:16px; display:grid; gap:12px}
.duelo .lados{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; text-align:center}
.duelo .lados b{font-family:var(--f-disp); font-size:34px; font-weight:600; line-height:1}
.duelo .lados span{display:block; font-family:var(--f-disp); font-size:14px; letter-spacing:.04em; margin-top:4px}
.duelo .vs{font-family:var(--f-disp); color:var(--apagado); font-size:13px; letter-spacing:.2em}
.barra-duelo{display:flex; height:8px; border-radius:9px; overflow:hidden; background:var(--sup3)}
.barra-duelo i{background:var(--acc)} .barra-duelo i + i{background:var(--linea2)}
.duelo small{color:var(--tenue); font-size:12.5px; text-align:center}
.miembros{display:grid; gap:0}

/* ============================================================ NAVEGACIÓN INFERIOR */
.nav{position:fixed; z-index:40; left:0; right:0; bottom:0; padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);
  background:var(--cristal); backdrop-filter:saturate(1.4) blur(18px); -webkit-backdrop-filter:saturate(1.4) blur(18px); border-top:1px solid var(--linea)}
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.nav a{display:grid; justify-items:center; gap:3px; padding:6px 0 4px; text-decoration:none; color:var(--apagado); font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; position:relative}
.nav a .ico{width:23px; height:23px}
.nav a[aria-current="page"]{color:var(--txt)}
.nav a[aria-current="page"] .ico{color:var(--acc-hi)}
.nav a[aria-current="page"]::before{content:""; position:absolute; top:-7px; width:26px; height:3px; border-radius:0 0 4px 4px; background:var(--acc)}
@media (min-width:900px){
  .nav{left:50%; right:auto; bottom:18px; transform:translateX(-50%); width:520px; border-radius:22px; border:1px solid var(--linea); padding:6px 8px; box-shadow:0 20px 40px -20px rgba(0,0,0,.7)}
  .nav a[aria-current="page"]::before{top:-6px}
}

/* tarjeta "Llévala en el móvil" (Inicio) */
.instala{padding:18px; display:grid; gap:14px; position:relative; overflow:hidden}
.instala::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--marca) 30%, transparent), transparent 70%); pointer-events:none}
.instala .cab{display:flex; align-items:center; gap:14px}
.instala .cab img{width:54px; height:54px; border-radius:14px; box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.instala h2{margin:0; font-family:var(--f-disp); font-weight:700; font-size:22px; letter-spacing:.02em; text-transform:uppercase}
.instala .cab p{margin:2px 0 0; font-size:13.5px; color:var(--tenue); line-height:1.35}
.instala ol{margin:0; padding:0; list-style:none; display:grid; gap:10px; counter-reset:paso}
.instala li{display:grid; grid-template-columns:30px 1fr; gap:12px; align-items:start; font-size:14.5px; line-height:1.4; counter-increment:paso}

<script>
'use strict';

const ICO = {

};

const HECHAS = DATOS.hechas;             // rondas disputadas
const N = HECHAS.length;
const CAL = DATOS.calendario;
const ronda = n => CAL.find(r => r.round === n);
const HOY = new Date(); HOY.setHours(0,0,0,0);
const fecha = (iso, op = {day:'numeric', month:'short'}) => new Date(iso + 'T12:00:00').toLocaleDateString('es-ES', op).replace('.', '');
const diasHasta = iso => Math.round((new Date(iso + 'T00:00:00') - HOY) / 864e5);
const nombreCorto = n => String(n).replace(/^WK\s+/, '');
const iniciales = n => { const p = nombreCorto(n).replace(/[^\p{L}\p{N}\s.]/gu, '').split(/[\s.]+/).filter(Boolean); return (p.length > 1 ? p[0][0] + p[1][0] : (p[0] || '?').slice(0, 2)).toUpperCase(); };
const esWK = n => /^WK\s/.test(n || '');
const signo = n => n > 0 ? '+' + n : String(n);
const ordenNombre = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

/* =================================================================== instalación (estado) */
const UA = navigator.userAgent;
const INST = {
  ios: /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  android: /Android/.test(UA),
  instalada: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  evento: null, hecha: false,
};
const COMPARTIR_IOS = '<svg class="ico-ios" viewBox="0 0 24 24" aria-label="Compartir"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
const iosEnOtraApp = () => /FBAN|FBAV|Instagram|WhatsApp|Line\/|TikTok|musical_ly|Twitter|GSA\//.test(UA);
const iosOtroNavegador = () => /CriOS|FxiOS|EdgiOS|OPiOS/.test(UA);
function textoInstalarIOS() {
  const pasos = `toca ${COMPARTIR_IOS} <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.`;
  if (iosEnOtraApp()) return 'Estás dentro de otra app. Toca <b>···</b> y elige <b>Abrir en Safari</b>; allí ' + pasos;
  if (iosOtroNavegador()) return 'Arriba a la derecha, ' + pasos;
  return 'Abajo, ' + pasos;
}

/* =================================================================== estado */
const st = {
  cat: guarda.get('kl:cat', 'k1'),
  vista: 'inicio',
  modo: guarda.get('kl:modo', 'pilotos'),      // pilotos · equipos · mangas
  descartes: guarda.get('kl:descartes', false),
  ronda: HECHAS[N - 1] || 1,
  sesion: 'c1',
  sancRonda: 0,
  busca: '',
  mio: guarda.get('kl:mio', null),            // {cat, id}
  so: INST.ios ? 'iphone' : 'android',        // pestaña de la tarjeta de instalar
};
if (!DATOS.categorias[st.cat]) st.cat = 'k1';
const CATS = Object.keys(DATOS.categorias);
const Cat = (c = st.cat) => DATOS.categorias[c];
const equipo = (slug, c = st.cat) => Cat(c).teams.find(t => t.id === slug) || { id: slug, name: slug ? slug.replace(/_/g, ' ').toUpperCase() : 'SIN EQUIPO', color: '#6B7390', logo: null, members: [] };
const piloto = (id, c = st.cat) => Cat(c).pilots.find(p => p.id === id);
const pilotoPorNombre = (n, c = st.cat) => Cat(c).pilots.find(p => p.name === n);
const colorCat = c => c === 'k2' ? 'var(--k2)' : 'var(--k1)';

/* =================================================================== cálculo */
const ptsCelda = c => (c && c.pts) ? c.pts : 0;

/** Clasificación de pilotos tras k rondas, con o sin descartar las 2 peores mangas. */
function general(c = st.cat, k = N, desc = st.descartes) {
  const out = Cat(c).pilots.map(p => {
    const arr = p.races.slice(0, 2 * k).map(ptsCelda);
    let total = arr.reduce((a, b) => a + b, 0), quitados = 0;
    const fuera = new Set();
    if (desc && arr.length > 2) {
      arr.map((v, i) => i).sort((a, b) => arr[a] - arr[b] || a - b).slice(0, 2).forEach(i => { fuera.add(i); quitados += arr[i]; });
      total -= quitados;
    }
    return { p, total, quitados, fuera };
  });
  out.sort((a, b) => b.total - a.total || ordenNombre(a.p.name, b.p.name));
  out.forEach((x, i) => x.pos = i + 1);
  return out;
}
function generalEquipos(c = st.cat, k = N) {
  const out = Cat(c).teams.map(t => ({ t, total: t.races.slice(0, 2 * k).reduce((a, b) => a + b, 0) }));
  out.sort((a, b) => b.total - a.total || ordenNombre(a.t.name, b.t.name));
  out.forEach((x, i) => x.pos = i + 1);
  return out;
}
function deltas(lista, previa, clave) {
  const prev = new Map(previa.map(x => [clave(x), x.pos]));
  return lista.map(x => { const a = prev.get(clave(x)); return a ? a - x.pos : 0; });
}
function posHist(c, id, desc = st.descartes) {
  const h = [];
  for (let k = 1; k <= N; k++) h.push(general(c, k, desc).find(x => x.p.id === id).pos);
  return h;
}

/* =================================================================== piezas */
function av(nombre, color, cls = '') {
  return `<span class="av ${cls}" style="--c:${esc(color)}" aria-hidden="true">${esc(iniciales(nombre))}</span>`;
}
function logoEq(t, cls = '') {
  if (!t || !t.logo) return `<span class="logo-eq ${cls}" aria-hidden="true"></span>`;
  return `<span class="logo-eq ${cls}"><img src="${esc(t.logo)}" alt="" loading="lazy"></span>`;
}
/** Trazado del circuito: su línea central, empezando en la meta y en el sentido
 *  de marcha. Meta (cuadros), flechas y kart solo si están confirmados en
 *  data/circuitos.json; `detalle` = false para las miniaturas. */
function pista(tr, cls = '', coche = false, id = '', detalle = true) {
  if (!tr) return '';
  const e = tr.escala;
  const pid = 'trk' + (id || Math.random().toString(36).slice(2, 7));
  let extra = '';
  if (detalle && tr.flechas) {
    const s = 2.4 * e;
    extra += tr.flechas.map(f => `<path class="trk-flecha" transform="translate(${f.x} ${f.y}) rotate(${f.a})" d="M${-s * .6} ${-s} L${s * .6} 0 L${-s * .6} ${s}"/>`).join('');
  }
  if (tr.meta) {
    const c = e * 1.6, filas = 6, cols = 2, g = [];
    for (let i = 0; i < cols; i++) for (let j = 0; j < filas; j++)
      g.push(`<rect x="${(i - cols / 2) * c}" y="${(j - filas / 2) * c}" width="${c}" height="${c}" fill="${(i + j) % 2 ? '#0A0E1C' : '#fff'}"/>`);
    extra += `<g class="trk-meta" transform="translate(${tr.meta.x} ${tr.meta.y}) rotate(${tr.meta.a})"><rect x="${-cols / 2 * c - e * .4}" y="${-filas / 2 * c - e * .4}" width="${cols * c + e * .8}" height="${filas * c + e * .8}" rx="${e * .5}" fill="#0A0E1C"/>${g.join('')}</g>`;
  }
  const car = coche && tr.sentido && !matchMedia('(prefers-reduced-motion: reduce)').matches
    ? `<circle class="trk-coche" r="${(1.5 * e).toFixed(1)}"><animateMotion dur="8s" begin="2.2s" repeatCount="indefinite" rotate="auto"><mpath href="#${pid}"/></animateMotion></circle>` : '';
  return `<svg viewBox="${esc(tr.viewBox)}" class="${cls}" aria-hidden="true" preserveAspectRatio="xMidYMid meet"><path class="trk-base" d="${tr.d}"/><path id="${pid}" class="trk-line" d="${tr.d}" pathLength="1000"/>${extra}${car}</svg>`;
}
function claseP(pos) { return pos === 1 ? 'p1' : pos === 2 ? 'p2' : pos === 3 ? 'p3' : ''; }
function deltaHTML(d) {
  if (N < 2) return '<span class="delta igual">·</span>';
  if (d > 0) return `<span class="delta sube" aria-label="Sube ${d}">▲${d}</span>`;
  if (d < 0) return `<span class="delta baja" aria-label="Baja ${-d}">▼${-d}</span>`;
  return '<span class="delta igual" aria-label="Igual">–</span>';
}
function formaHTML(p, fuera) {
  const ult = p.races.map((c, i) => ({ c, i })).slice(-4);
  return '<span class="forma" aria-label="Últimas cuatro mangas">' + ult.map(({ c, i }) => {
    const x = fuera && fuera.has(i) ? ' x' : '';
    if (!c || c.pos == null) return `<i class="${x}" title="No disputada">·</i>`;
    if (c.dns) return `<i class="dns${x}">DNS</i>`;
    return `<i class="${claseP(c.pos)}${x}">${c.pos}</i>`;
  }).join('') + '</span>';
}
function rotulo(txt, der = '') { return `<h2 class="rotulo">${txt}${der ? `<span class="der">${der}</span>` : ''}</h2>`; }
const etiquetaRonda = n => { const r = ronda(n); return r ? `R${n} · ${r.circuit}` : `R${n}`; };
function mio() { return st.mio && Cat(st.mio.cat) ? piloto(st.mio.id, st.mio.cat) : null; }
function esMio(p, c = st.cat) { return st.mio && st.mio.cat === c && st.mio.id === p.id; }

/* =================================================================== INSTALAR (tarjeta de Inicio) */

      <div><h2>Llévala en el móvil</h2><p>Sin tiendas ni registros: se instala desde aquí, se abre como una app y se actualiza sola.</p></div></div>`;

      <li><span>Toca ${COMPARTIR_IOS} <b>Compartir</b>.<small>${otro ? 'En Chrome o Firefox está arriba a la derecha.' : 'En Safari está abajo, en el centro (arriba a la derecha en iPad).'}</small></span></li>
      <li><span>Baja y toca <b>Añadir a pantalla de inicio</b>, y luego <b>Añadir</b>.<small>Aparecerá el icono de Karting League junto al resto de tus apps.</small></span></li>
    </ol>`;
  } else {
    pasos = INST.evento
      ? `<button class="btn" type="button" id="btnInstalarApp" style="justify-self:start">Instalar la app</button>
         <ol><li><span>Pulsa <b>Instalar la app</b> y confirma.<small>Aparecerá el icono de Karting League en tu pantalla de inicio.</small></span></li></ol>`
      : `<ol>
      <li><span>Abre esta página en <b>Chrome</b>.<small>Si te llegó por WhatsApp o Instagram, toca <b>⋮</b> → <b>Abrir en Chrome</b>.</small></span></li>
      <li><span>Toca el menú <span class="tecla">⋮</span> arriba a la derecha.</span></li>
      <li><span>Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>, y confirma.<small>Aparecerá el icono de Karting League junto al resto de tus apps.</small></span></li>
    </ol>`;
